# Continuous integration for the vector-tile workspace.
# Runs format + lint + the full test suite (unit + end-to-end) on stable Rust.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Respects the repo's rust-toolchain.toml (stable channel).
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The zipped Shapefile fixtures are generated (not checked in) to keep
      # binaries out of Git; the end-to-end tests consume them.
      - name: Generate test fixtures
        run: cargo run -p vtile-ingest --example gen_fixtures

      - name: Test
        run: cargo test --workspace
